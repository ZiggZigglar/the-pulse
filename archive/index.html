<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Pulse: Archive</title>
<style>
:root{--bg:#0b0d10;--card:#12151a;--border:#1e232b;--text:#e6e9ef;--muted:#8b95a3;--amber:#f0a04b}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text)}
body{font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.wrap{max-width:640px;margin:0 auto;padding:24px 16px 48px}
h1{font-size:22px;font-weight:800;margin:0 0 4px}
h1 .amber{color:var(--amber)}
p.sub{color:var(--muted);font-size:13px;margin:0 0 20px}
a.back{color:var(--amber);text-decoration:none;font-size:13px;font-weight:600}
ul{list-style:none;margin:20px 0 0;padding:0}
li{border-bottom:1px solid var(--border);padding:14px 0}
li:last-child{border-bottom:none}
li a{color:var(--text);text-decoration:none;font-weight:600}
li a:hover{color:var(--amber)}
.empty{color:var(--muted);padding:24px 0;font-size:13.5px}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="../">&larr; Back to today</a>
  <h1><span class="amber">Pulse</span> archive</h1>
  <p class="sub">Past editions, newest first.</p>
  <div class="empty">Nothing archived yet. This is the first edition.</div>
  <ul>
  </ul>
</div>
</body>
</html>
